<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" role="img" aria-labelledby="fig4-title fig4-desc">
  <title id="fig4-title">FIG 04 — Origin Cache (s3c_) and Ack-First Write-Back Outbox (s3w_) Tracks</title>
  <desc id="fig4-desc">Four-station horizontal tracks showing where Cold Fills, Aligned Parquet Range Reads, and Ack-First Write-Back Uploads commit and acknowledge.</desc>
  <defs>
    <marker id="f4-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--blue)"/>
    </marker>
    <marker id="f4-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--success)"/>
    </marker>
    <marker id="f4-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--warning)"/>
    </marker>
  </defs>
  <style>
    svg {
      color-scheme: light dark;
      --bg: light-dark(#ffffff, #09090b);
      --hdr: light-dark(#fafafa, #141418);
      --swim: light-dark(#fafafa, #18181b);
      --card: light-dark(#ffffff, #1e1e22);
      --border: light-dark(#e4e4e7, #303036);
      --fg: light-dark(#262626, #e5e5e5);
      --muted: light-dark(#71717a, #a1a1aa);
      --blue: light-dark(#0284c7, #38bdf8);
      --success: light-dark(#008032, #6cc070);
      --warning: light-dark(#a65b00, #f0a030);
      --purple: light-dark(#7c3aed, #c084fc);
      --hit: light-dark(#e6f4ea, #064e3b);
      --stage: light-dark(#fef3c7, #1c1917);
    }
    .bg { fill: var(--bg); }
    .hdr { fill: var(--hdr); stroke: var(--border); stroke-width: 1; }
    .swim { fill: var(--swim); stroke: var(--border); stroke-width: 1.3; rx: 8; }
    .node { fill: var(--card); stroke: var(--border); stroke-width: 1.3; rx: 6; }
    .node-hit { fill: var(--hit); stroke: var(--success); stroke-width: 1.6; rx: 6; }
    .node-st { fill: var(--stage); stroke: var(--warning); stroke-width: 1.6; rx: 6; }
    .fig { fill: var(--blue); font: 700 10.5px ui-monospace, Consolas, monospace; letter-spacing: 0.06em; }
    .title { fill: var(--fg); font: 600 14.5px system-ui, -apple-system, sans-serif; }
    .lane-t { fill: var(--fg); font: 600 12px system-ui, -apple-system, sans-serif; }
    .h4 { fill: var(--fg); font: 600 11.5px system-ui, -apple-system, sans-serif; }
    .sub { fill: var(--muted); font: 400 10.5px system-ui, -apple-system, sans-serif; }
    .mono { fill: var(--fg); font: 600 10.5px ui-monospace, Consolas, monospace; }
    .cb { fill: var(--blue); }
    .cg { fill: var(--success); }
    .ca { fill: var(--warning); }
    .cp { fill: var(--purple); }
    .ln-b { stroke: var(--blue); stroke-width: 2.2; fill: none; stroke-dasharray: 7 5; animation: f4-d 1.3s linear infinite; }
    .ln-g { stroke: var(--success); stroke-width: 2.2; fill: none; stroke-dasharray: 7 5; animation: f4-d 1.3s linear infinite; }
    .ln-a { stroke: var(--warning); stroke-width: 2.2; fill: none; stroke-dasharray: 7 5; animation: f4-d 1.5s linear infinite; }
    @keyframes f4-d { to { stroke-dashoffset: -24; } }
    @media (prefers-reduced-motion: reduce) {
      .ln-b, .ln-g, .ln-a { animation: none; }
      .pkt { display: none; }
    }
  </style>

  <rect width="1040" height="440" class="bg" rx="8"/>
  <rect x="0" y="0" width="1040" height="44" class="hdr" rx="8"/>
  <text x="24" y="27" class="fig">FIG 04</text>
  <text x="80" y="27" class="title">Shared Origin Cache (s3c_) &amp; Ack-First Write-Back Outbox (s3w_)</text>

  <!-- Track 1: Cold Fill -->
  <rect x="20" y="56" width="1000" height="114" class="swim"/>
  <text x="36" y="76" class="lane-t cb">Track 1 — Coalesced Cold Fill → Shared Cross-Gateway &amp; Standby HIT</text>

  <rect x="36" y="88" width="214" height="66" class="node"/>
  <text x="48" y="110" class="h4">1. Lease Ownership</text>
  <text x="48" y="128" class="mono cb">s3p.cache_fill_leases</text>
  <text x="48" y="144" class="sub">1 worker fetches; peers wait</text>

  <rect x="284" y="88" width="214" height="66" class="node"/>
  <text x="296" y="110" class="h4">2. Spool Outside DB Tx</text>
  <text x="296" y="128" class="mono">--spool-dir (&gt;8 MiB)</text>
  <text x="296" y="144" class="sub">0 DB conns held on download</text>

  <rect x="532" y="88" width="214" height="66" class="node"/>
  <text x="544" y="110" class="h4">3. Version-Fenced Publish</text>
  <text x="544" y="128" class="mono">s3c_&lt;ns&gt;.chunks (WAL)</text>
  <text x="544" y="144" class="sub">Checks live owner + ETag</text>

  <rect x="780" y="88" width="224" height="66" class="node-hit"/>
  <text x="792" y="110" class="h4 cg">4. Fleet &amp; Standby HIT</text>
  <text x="792" y="128" class="mono">X-Cache: HIT (0 Origin GETs)</text>
  <text x="792" y="144" class="sub">Post-TTL: HEAD revalidates</text>

  <path id="p4-t1" d="M 250 121 L 278 121" class="ln-b" marker-end="url(#f4-b)"/>
  <path d="M 498 121 L 526 121" class="ln-a" marker-end="url(#f4-a)"/>
  <path d="M 746 121 L 774 121" class="ln-g" marker-end="url(#f4-g)"/>

  <!-- Track 2: Aligned Range Cache -->
  <rect x="20" y="184" width="1000" height="114" class="swim"/>
  <text x="36" y="204" class="lane-t cg">Track 2 — Aligned Parquet Range Cache (--range-cache-chunk 1048576)</text>

  <rect x="36" y="216" width="296" height="66" class="node"/>
  <text x="48" y="238" class="h4">1. DuckDB Footer &amp; Column Range</text>
  <text x="48" y="256" class="mono cb">Range: bytes=start-end</text>
  <text x="48" y="272" class="sub">Skips unprojected wide columns</text>

  <rect x="370" y="216" width="296" height="66" class="node"/>
  <text x="382" y="238" class="h4">2. Parent Validator + 1 MiB Slices</text>
  <text x="382" y="256" class="mono">origin_metadata + s3c_ blocks</text>
  <text x="382" y="272" class="sub">Never confuses metadata w/ full body</text>

  <rect x="704" y="216" width="300" height="66" class="node-hit"/>
  <text x="716" y="238" class="h4 cg">3. 206 Partial Content HIT</text>
  <text x="716" y="256" class="mono">Shared across gateways &amp; standbys</text>
  <text x="716" y="272" class="sub">Reused by subsequent selective scans</text>

  <path d="M 332 249 L 364 249" class="ln-b" marker-end="url(#f4-b)"/>
  <path d="M 666 249 L 698 249" class="ln-g" marker-end="url(#f4-g)"/>

  <!-- Track 3: Ack-First Write-Back -->
  <rect x="20" y="312" width="1000" height="114" class="swim"/>
  <text x="36" y="332" class="lane-t ca">Track 3 — Ack-First Durable Write-Back (&gt;8 MiB PUT / Multipart) → Leased Outbox Drain</text>

  <rect x="36" y="344" width="214" height="66" class="node-st"/>
  <text x="48" y="366" class="h4 ca">1. Atomic PG Commit</text>
  <text x="48" y="384" class="mono">s3w_ + pending_uploads</text>
  <text x="48" y="400" class="sub">expires_at IS NULL (Sole Copy!)</text>

  <rect x="284" y="344" width="214" height="66" class="node-hit"/>
  <text x="296" y="366" class="h4 cg">2. Fast 200 OK &amp; Read HIT</text>
  <text x="296" y="384" class="mono">Immediate MVCC visibility</text>
  <text x="296" y="400" class="sub">Stable public content ETag</text>

  <rect x="532" y="344" width="214" height="66" class="node"/>
  <text x="544" y="366" class="h4">3. Advisory-Locked Upload</text>
  <text x="544" y="384" class="mono cb">5m lease + PG key lock</text>
  <text x="544" y="400" class="sub">Serializes per-key origin order</text>

  <rect x="780" y="344" width="224" height="66" class="node"/>
  <text x="792" y="366" class="h4 cp">4. Token-Fenced Handoff</text>
  <text x="792" y="384" class="mono">Origin now Copy of Record</text>
  <text x="792" y="400" class="sub">Enables normal 24h retention</text>

  <path d="M 250 377 L 278 377" class="ln-g" marker-end="url(#f4-g)"/>
  <path d="M 498 377 L 526 377" class="ln-b" marker-end="url(#f4-b)"/>
  <path d="M 746 377 L 774 377" class="ln-a" marker-end="url(#f4-a)"/>
</svg>
