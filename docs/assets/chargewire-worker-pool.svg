<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-labelledby="fig7-title fig7-desc">
  <title id="fig7-title">FIG 07 — ChargeWire Client-to-Worker Pool, Gateway Admission and PostgreSQL Capacity Model</title>
  <desc id="fig7-desc">Four left-to-right capacity tiers: C ChargeWire clients over ADBC, JDBC, JavaScript or plain HTTP with Arrow IPC results, question-mark or dollar-one bind parameters and async poll/resume, routed round-robin across W Hardcharger workers for stateless lake queries; W pgvs3-duckdb 2.0.0 Hardcharger workers, each a PID-1 daemon on port 31337 with a plaintext 31338 health listener for drain, default_catalog lake, shared T = 4 CPU threads, an async HTTP pool A = min(4 times CPU, 256) and per-worker native RTree or HNSW in memory dot main; G pgvs3 gateways admitting 32 active plus 64 queued S3 requests per gateway with a chunkPool guard plus workers per multi-piece read and an optional zero-copy block cache; and PostgreSQL 18 plus an S3 origin, where direct DuckLake catalog connections a_w per active transaction bypass pgvs3 and the total gateway pool envelope must fit max_connections.</desc>
  <defs>
    <marker id="f7-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--blue)"/>
    </marker>
    <marker id="f7-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--success)"/>
    </marker>
    <marker id="f7-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--warning)"/>
    </marker>
  </defs>
  <style>
    svg {
      color-scheme: light dark;
      --bg: light-dark(#ffffff, #09090b);
      --hdr: light-dark(#fafafa, #121215);
      --panel: light-dark(#fafafa, #141417);
      --card: light-dark(#ffffff, #18181b);
      --pill: light-dark(#f4f4f5, #27272a);
      --border: light-dark(#e4e4e7, #303036);
      --fg: light-dark(#262626, #e5e5e5);
      --muted: light-dark(#71717a, #a1a1aa);
      --blue: light-dark(#0369a1, #38bdf8);
      --success: light-dark(#008032, #6cc070);
      --warning: light-dark(#a65b00, #f0a030);
      --purple: light-dark(#6d28d9, #c084fc);
      --danger: light-dark(#d32f2f, #f4807b);
    }
    .bg { fill: var(--bg); }
    .hdr { fill: var(--hdr); }
    .stage { fill: var(--panel); stroke: var(--border); stroke-width: 1; }
    .card { fill: var(--card); stroke: var(--border); stroke-width: 1.2; }
    .chip { fill: var(--pill); stroke: var(--border); stroke-width: 1; }
    .fig { fill: var(--blue); font: 700 10.5px ui-monospace, Consolas, monospace; letter-spacing: 0.06em; }
    .title { fill: var(--fg); font: 600 14.5px system-ui, -apple-system, sans-serif; }
    .h3 { fill: var(--fg); font: 600 13px system-ui, -apple-system, sans-serif; }
    .h4 { fill: var(--fg); font: 600 12px system-ui, -apple-system, sans-serif; }
    .sub { fill: var(--muted); font: 400 10px system-ui, -apple-system, sans-serif; }
    .mono { fill: var(--fg); font: 600 10px ui-monospace, Consolas, monospace; }
    .mono-s { fill: var(--fg); font: 500 9.5px ui-monospace, Consolas, monospace; }
    .mono-xs { fill: var(--fg); font: 500 9.2px ui-monospace, Consolas, monospace; }
    .eq { fill: var(--blue); font: 700 13px ui-monospace, Consolas, monospace; }
    .eq-s { fill: var(--blue); font: 600 10.5px ui-monospace, Consolas, monospace; }
    .cb { fill: var(--blue); }
    .cg { fill: var(--success); }
    .ca { fill: var(--warning); }
    .cp { fill: var(--purple); }
    .dot-b { fill: var(--blue); }
    .dot-g { fill: var(--success); }
    .dot-a { fill: var(--warning); }
    .dot-p { fill: var(--purple); }
    .ln { stroke: var(--border); stroke-width: 1.2; fill: none; }
    .flow { stroke-width: 1.6; fill: none; stroke-dasharray: 5 7; stroke-linecap: round; animation: dash 1.8s linear infinite; }
    .flow-b { stroke: var(--blue); }
    .flow-g { stroke: var(--success); }
    .flow-a { stroke: var(--warning); }
    .s1 { animation-delay: 0s; }
    .s2 { animation-delay: 0.3s; }
    .s3 { animation-delay: 0.6s; }
    .s4 { animation-delay: 0.9s; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .grow { animation: grow 3s ease-in-out infinite; transform-origin: left center; }
    .conn { stroke: var(--blue); stroke-width: 2; fill: none; animation: conn 2.6s ease-in-out infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes grow { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    @keyframes conn { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>

  <rect width="1280" height="560" class="bg" rx="8"/>
  <rect x="0" y="0" width="1280" height="44" class="hdr" rx="8"/>
  <line x1="0" y1="44" x2="1280" y2="44" class="ln"/>
  <text x="24" y="27" class="fig">FIG 07</text>
  <text x="80" y="27" class="title">ChargeWire Client-to-Worker Pool &amp; PostgreSQL Capacity Envelope</text>
  <text x="884" y="26" class="mono-s cg">C × W measured · 4-tier admission model</text>

  <!-- Tier 1: C ChargeWire clients -->
  <rect x="20" y="62" width="286" height="432" class="stage" rx="8"/>
  <text x="36" y="86" class="fig">TIER 1</text>
  <text x="36" y="108" class="h3 cb">C ChargeWire Clients</text>

  <rect x="36" y="120" width="254" height="62" class="card" rx="6"/>
  <rect x="36" y="126" width="4" height="50" rx="2" fill="var(--blue)"/>
  <text x="48" y="145" class="eq">C ≤ W × Q</text>
  <text x="48" y="164" class="mono-xs">Q = server max_sessions (0: unlimited)</text>
  <circle cx="270" cy="131" r="3" class="dot-b pulse"/>

  <rect x="36" y="194" width="254" height="104" class="card" rx="6"/>
  <rect x="36" y="200" width="4" height="92" rx="2" fill="var(--blue)"/>
  <text x="48" y="214" class="mono cb">ADBC · JDBC · JS · HTTP + Arrow IPC</text>
  <text x="48" y="232" class="sub">? and $1 bind parameters</text>
  <text x="48" y="248" class="sub">async poll / resumable results</text>
  <circle cx="58" cy="272" r="5" class="dot-b conn"/>
  <circle cx="82" cy="272" r="5" class="dot-b conn" style="animation-delay:0.25s"/>
  <circle cx="106" cy="272" r="5" class="dot-b conn" style="animation-delay:0.5s"/>
  <circle cx="130" cy="272" r="5" class="dot-b conn" style="animation-delay:0.75s"/>
  <text x="150" y="276" class="mono-xs">… C clients</text>

  <rect x="36" y="310" width="254" height="98" class="card" rx="6"/>
  <rect x="36" y="316" width="4" height="86" rx="2" fill="var(--success)"/>
  <text x="48" y="330" class="mono cg">routing = client i → worker i mod W</text>
  <text x="48" y="348" class="sub">round-robin for stateless lake queries</text>
  <text x="48" y="364" class="sub">sticky while a session holds state</text>
  <text x="48" y="386" class="mono-xs">one session never splits a statement</text>

  <rect x="36" y="420" width="254" height="58" class="card" rx="6"/>
  <rect x="36" y="426" width="4" height="46" rx="2" fill="var(--warning)"/>
  <text x="48" y="440" class="mono ca">Sessions are per worker</text>
  <text x="48" y="458" class="sub">W is a scale-out unit, not a shard</text>

  <!-- Tier 2: W workers -->
  <rect x="332" y="62" width="286" height="432" class="stage" rx="8"/>
  <text x="348" y="86" class="fig">TIER 2</text>
  <text x="348" y="108" class="h3 cg">W Hardcharger Workers</text>
  <text x="348" y="123" class="mono-xs cg">pgvs3-duckdb:2.0.0</text>

  <rect x="348" y="134" width="254" height="62" class="card" rx="6"/>
  <rect x="348" y="140" width="4" height="50" rx="2" fill="var(--success)"/>
  <text x="360" y="159" class="eq-s">PID-1 daemon · :31337 · /health :31338</text>
  <text x="360" y="177" class="mono-xs">graceful drain · docker stop → 0</text>
  <circle cx="582" cy="145" r="3" class="dot-g pulse"/>

  <rect x="348" y="208" width="254" height="122" class="card" rx="6"/>
  <rect x="348" y="214" width="4" height="110" rx="2" fill="var(--success)"/>
  <text x="360" y="228" class="mono cg">default_catalog = lake</text>
  <text x="360" y="246" class="sub">T = 4 shared CPU threads</text>
  <rect x="360" y="256" width="52" height="8" rx="2" class="cb grow"/>
  <rect x="418" y="256" width="52" height="8" rx="2" class="cb grow s1"/>
  <rect x="476" y="256" width="52" height="8" rx="2" class="cb grow s2"/>
  <rect x="534" y="256" width="52" height="8" rx="2" class="cb grow s3"/>
  <text x="360" y="282" class="mono-xs">A = min(4 × CPU, 256) async HTTP pool</text>
  <text x="360" y="300" class="sub">threads, not sessions, bound scan CPU</text>
  <text x="360" y="316" class="mono-xs">memory_limit M covers buffer manager</text>

  <rect x="348" y="342" width="254" height="136" class="card" rx="6"/>
  <rect x="348" y="348" width="4" height="124" rx="2" fill="var(--purple)"/>
  <text x="360" y="362" class="mono cp">native RTree / HNSW in memory.main</text>
  <text x="360" y="380" class="sub">per-worker snapshot materialization</text>
  <text x="360" y="396" class="sub">not covered by memory_limit</text>
  <text x="360" y="416" class="mono-xs">index build is a one-time worker cost</text>
  <text x="360" y="434" class="sub">rebuild when lake freshness matters</text>
  <text x="360" y="456" class="mono-xs ca">W × index bytes is separate RAM cost</text>

  <!-- Tier 3: G gateways -->
  <rect x="644" y="62" width="286" height="432" class="stage" rx="8"/>
  <text x="660" y="86" class="fig">TIER 3</text>
  <text x="660" y="108" class="h3 ca">G pgvs3 Gateways</text>
  <text x="660" y="123" class="mono-xs ca">:8014 · S3 / HTTP / RESP</text>

  <rect x="660" y="134" width="254" height="62" class="card" rx="6"/>
  <rect x="660" y="140" width="4" height="50" rx="2" fill="var(--warning)"/>
  <text x="672" y="159" class="eq-s">G ≥ ⌈R / 32⌉  zero queue</text>
  <text x="672" y="177" class="eq-s">G ≥ ⌈R / 96⌉  burst</text>
  <circle cx="894" cy="145" r="3" class="dot-a pulse"/>

  <rect x="660" y="208" width="254" height="98" class="card" rx="6"/>
  <rect x="660" y="214" width="4" height="86" rx="2" fill="var(--warning)"/>
  <text x="672" y="228" class="mono ca">S3 guard per gateway</text>
  <text x="672" y="246" class="sub">32 active + 64 queued = 96 burst</text>
  <text x="672" y="264" class="sub">queue wait 1 s, then 503 SlowDown</text>
  <text x="672" y="288" class="mono-xs">--s3-concurrency 32 · --s3-queue-wait</text>

  <rect x="660" y="318" width="254" height="94" class="card" rx="6"/>
  <rect x="660" y="324" width="4" height="82" rx="2" fill="var(--blue)"/>
  <text x="672" y="338" class="mono cb">chunkPool: 1 guard + w workers</text>
  <text x="672" y="356" class="sub">w = clamp(⌊(B/2 − R) / R⌋, 1, 8)</text>
  <text x="672" y="374" class="sub">B = min(P, 64) chunk connections</text>
  <text x="672" y="396" class="mono-xs">R=1 → 9 conns · R=32 → 2 conns</text>

  <rect x="660" y="424" width="254" height="54" class="card" rx="6"/>
  <rect x="660" y="430" width="4" height="42" rx="2" fill="var(--success)"/>
  <text x="672" y="444" class="mono cg">--read-cache-bytes block hits</text>
  <text x="672" y="462" class="sub">zero-copy · bypasses chunkPool + PostgreSQL</text>

  <!-- Tier 4: PostgreSQL + origin -->
  <rect x="956" y="62" width="304" height="432" class="stage" rx="8"/>
  <text x="972" y="86" class="fig">TIER 4</text>
  <text x="972" y="108" class="h3 cp">PostgreSQL 18 &amp; S3 Origin</text>

  <rect x="972" y="120" width="272" height="78" class="card" rx="6"/>
  <rect x="972" y="126" width="4" height="66" rx="2" fill="var(--purple)"/>
  <text x="984" y="144" class="eq-s">G_peak × (P + min(P, 64))</text>
  <text x="984" y="162" class="eq-s">+ Σ a_w + other + reserved</text>
  <text x="984" y="181" class="mono-xs">must stay below max_connections</text>
  <circle cx="1228" cy="131" r="3" class="dot-p pulse"/>

  <rect x="972" y="210" width="272" height="90" class="card" rx="6"/>
  <rect x="972" y="216" width="4" height="78" rx="2" fill="var(--warning)"/>
  <text x="984" y="230" class="mono ca">DuckLake catalog: direct a_w</text>
  <text x="984" y="248" class="sub">per active transaction, bypasses pgvs3</text>
  <text x="984" y="266" class="sub">G_peak = G + rollout surge</text>
  <text x="984" y="286" class="mono-xs">budget it with --compute-workers</text>

  <rect x="972" y="312" width="272" height="86" class="card" rx="6"/>
  <rect x="972" y="318" width="4" height="74" rx="2" fill="var(--blue)"/>
  <text x="984" y="332" class="mono cb">s3b_ / s3c_ / s3w_</text>
  <text x="984" y="350" class="sub">8,120 B chunks · one tuple per 8 KiB page</text>
  <text x="984" y="368" class="sub">bitmap heap scan · no out-of-line TOAST</text>
  <text x="984" y="388" class="mono-xs">chunk pool reads 256 KiB socket buffers</text>

  <rect x="972" y="410" width="272" height="68" class="card" rx="6"/>
  <rect x="972" y="416" width="4" height="56" rx="2" fill="var(--success)"/>
  <text x="984" y="430" class="mono cg">S3 origin fills</text>
  <text x="984" y="448" class="sub">--fill-concurrency F on serve + origin set</text>
  <text x="984" y="466" class="mono-xs">bounded 8 MiB contiguous fill runs</text>

  <!-- Animated flows between tiers -->
  <path d="M 306 250 H 332" class="ln"/>
  <path d="M 306 250 H 332" class="flow flow-b s1" marker-end="url(#f7-b)"/>
  <text x="319" y="238" text-anchor="middle" class="mono-xs cb">ADBC</text>
  <text x="319" y="270" text-anchor="middle" class="sub">1 stmt</text>

  <path d="M 618 250 H 644" class="ln"/>
  <path d="M 618 250 H 644" class="flow flow-g s2" marker-end="url(#f7-g)"/>
  <text x="631" y="238" text-anchor="middle" class="mono-xs cg">httpfs</text>
  <text x="631" y="270" text-anchor="middle" class="sub">GETs</text>

  <path d="M 930 250 H 956" class="ln"/>
  <path d="M 930 250 H 956" class="flow flow-a s3" marker-end="url(#f7-a)"/>
  <text x="943" y="238" text-anchor="middle" class="mono-xs ca">SQL</text>
  <text x="943" y="270" text-anchor="middle" class="sub">chunks</text>

  <!-- Return data path under the tiers -->
  <path d="M 956 310 H 930" class="ln"/>
  <path d="M 956 310 H 930" class="flow flow-g s4" marker-end="url(#f7-g)"/>
  <path d="M 644 310 H 618" class="ln"/>
  <path d="M 644 310 H 618" class="flow flow-b s4" marker-end="url(#f7-b)"/>
  <path d="M 332 310 H 306" class="ln"/>
  <path d="M 332 310 H 306" class="flow flow-b s4" marker-end="url(#f7-b)"/>

  <!-- Footer -->
  <line x1="20" y1="508" x2="1260" y2="508" class="ln"/>
  <text x="20" y="526" class="mono-xs cg">Measured 2026-11-12 · 45 cells: W = 1, 2, 4 × C = 1, 4, 8, 16, 32 · 1M-row DuckLake + 5k-point native RTree · T = 4, M = 1 GiB</text>
  <text x="20" y="544" class="sub">A 256 MiB gateway read cache removed timed chunkPool acquires (7 vs up to 32 chunk connections); lake q/s reached ~200–242 at every W, while native RTree reached ~1,026 q/s at W = 4, C = 32.</text>
</svg>
