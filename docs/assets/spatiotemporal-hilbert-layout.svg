<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" role="img" aria-labelledby="fig5-title fig5-desc">
  <title id="fig5-title">FIG 05 — Density-Adaptive 24-Bit Hilbert Sorting and Late Materialization</title>
  <desc id="fig5-desc">Visual comparison of skewed spatial data in an equal-area grid versus 1D Hilbert sorting sliced into equal-byte Parquet row groups and two-phase late materialization.</desc>
  <defs>
    <marker id="f5-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--success)"/>
    </marker>
  </defs>
  <style>
    svg {
      color-scheme: light dark;
      --bg: light-dark(#ffffff, #09090b);
      --hdr: light-dark(#fafafa, #141418);
      --panel: light-dark(#fafafa, #18181b);
      --box: light-dark(#ffffff, #1e1e22);
      --pill: light-dark(#f4f4f5, #27272a);
      --border: light-dark(#e4e4e7, #303036);
      --fg: light-dark(#262626, #e5e5e5);
      --muted: light-dark(#71717a, #a1a1aa);
      --blue: light-dark(#0284c7, #38bdf8);
      --success: light-dark(#008032, #6cc070);
      --warning: light-dark(#a65b00, #f0a030);
      --danger: light-dark(#d32f2f, #f4807b);
      --hit: light-dark(#e6f4ea, #064e3b);
      --bad: light-dark(#fef2f2, #1f1215);
    }
    .bg { fill: var(--bg); }
    .hdr { fill: var(--hdr); stroke: var(--border); stroke-width: 1; }
    .card-bad { fill: var(--bad); stroke: var(--danger); stroke-width: 1.5; rx: 8; }
    .card-good { fill: var(--panel); stroke: var(--success); stroke-width: 1.6; rx: 8; }
    .card-late { fill: var(--panel); stroke: var(--border); stroke-width: 1.4; rx: 8; }
    .grid-bg { fill: var(--box); stroke: var(--border); stroke-width: 1.2; rx: 4; }
    .grid-ln { stroke: var(--border); stroke-width: 1; }
    .rg-sp { fill: var(--pill); stroke: var(--blue); stroke-width: 1.3; rx: 4; }
    .rg-dn { fill: var(--hit); stroke: var(--success); stroke-width: 1.3; rx: 4; }
    .box { fill: var(--box); stroke: var(--border); stroke-width: 1.3; rx: 6; }
    .box-hit { fill: var(--hit); stroke: var(--success); stroke-width: 1.5; rx: 6; }
    .fig { fill: var(--blue); font: 700 10.5px ui-monospace, Consolas, monospace; letter-spacing: 0.06em; }
    .title { fill: var(--fg); font: 600 14.5px system-ui, -apple-system, sans-serif; }
    .h3 { fill: var(--fg); font: 600 12.5px system-ui, -apple-system, sans-serif; }
    .sub { fill: var(--muted); font: 400 10.5px system-ui, -apple-system, sans-serif; }
    .mono { fill: var(--fg); font: 600 10.5px ui-monospace, Consolas, monospace; }
    .cb { fill: var(--blue); }
    .cg { fill: var(--success); }
    .ca { fill: var(--warning); }
    .cr { fill: var(--danger); }
    .h-curve { stroke: var(--warning); stroke-width: 2.5; fill: none; stroke-dasharray: 10 5; animation: f5-m 2s linear infinite; }
    .f-arr { stroke: var(--success); stroke-width: 2.3; fill: none; stroke-dasharray: 7 5; animation: f5-m 1.3s linear infinite; }
    @keyframes f5-m { to { stroke-dashoffset: -30; } }
    @media (prefers-reduced-motion: reduce) {
      .h-curve, .f-arr { animation: none; }
    }
  </style>

  <rect width="1040" height="440" class="bg" rx="8"/>
  <rect x="0" y="0" width="1040" height="44" class="hdr" rx="8"/>
  <text x="24" y="27" class="fig">FIG 05</text>
  <text x="80" y="27" class="title">Density-Adaptive 24-Bit Hilbert Sorting &amp; Two-Phase Late Materialization</text>

  <!-- Left: Equal-Area Trap -->
  <rect x="20" y="58" width="292" height="232" class="card-bad"/>
  <text x="36" y="82" class="h3 cr">Equal-Area Grid Trap (90% Skew)</text>

  <rect x="36" y="96" width="112" height="112" class="grid-bg"/>
  <path d="M 64 96 V 208 M 92 96 V 208 M 120 96 V 208 M 36 124 H 148 M 36 152 H 148 M 36 180 H 148" class="grid-ln"/>
  <rect x="93" y="125" width="26" height="26" fill="var(--danger)"/>
  <text x="160" y="116" class="mono cr">1 Cell = 90% Rows</text>
  <text x="160" y="134" class="sub">1 overloaded partition;</text>
  <text x="160" y="150" class="sub">63 empty ocean cells</text>
  <text x="160" y="166" class="sub">write &lt;1 MiB files!</text>

  <text x="36" y="232" class="mono cr">SORTED BY (lat, lon) Trap:</text>
  <text x="36" y="250" class="sub">Orders lat, but lon spans [-180°,+180°]</text>
  <text x="36" y="266" class="sub">in every stripe → 0 lon pruning!</text>

  <!-- Right: 24-Bit Hilbert + Equal-Byte Row Groups -->
  <rect x="332" y="58" width="688" height="232" class="card-good"/>
  <text x="350" y="82" class="h3 cg">SORTED BY (hilbert_id, ts): Equal-Byte Row Groups Auto-Adapt to Density</text>

  <rect x="350" y="96" width="144" height="144" class="grid-bg"/>
  <path d="M 386 96 V 240 M 422 96 V 240 M 458 96 V 240 M 350 132 H 494 M 350 168 H 494 M 350 204 H 494" class="grid-ln"/>
  <rect x="423" y="133" width="34" height="34" fill="var(--success)" fill-opacity="0.25" stroke="var(--success)"/>
  <path d="M 368 114 L 404 114 L 404 150 L 368 150 L 368 186 L 368 222 L 404 222 L 404 186 L 440 186 L 440 222 L 476 222 L 476 186 L 476 150 L 440 150 L 440 114 L 476 114" class="h-curve"/>
  <text x="350" y="256" class="mono ca">4096² grid (24-bit)</text>
  <text x="350" y="272" class="sub">4×6-bit · unpartitioned</text>

  <text x="516" y="110" class="mono cb">1D Hilbert Stream Sliced by Equal Bytes (32 MB Row Groups):</text>

  <rect x="516" y="120" width="480" height="30" class="rg-sp"/>
  <text x="528" y="139" class="mono">RG 0 (10% Sparse US/Ocean): 1 Row Group covers [25°..50°, -125°..-74°]</text>

  <rect x="516" y="158" width="152" height="30" class="rg-dn"/>
  <text x="526" y="177" class="mono">RG 1: NYC 0.01°</text>

  <rect x="680" y="158" width="152" height="30" class="rg-dn"/>
  <text x="690" y="177" class="mono">RG 2: NYC 0.01°</text>

  <rect x="844" y="158" width="152" height="30" class="rg-dn"/>
  <text x="854" y="177" class="mono">RG 3..9: NYC 0.01°</text>

  <text x="516" y="212" class="sub">• Zero empty ocean files: sparse cells pack into RG 0.</text>
  <text x="516" y="230" class="sub">• 90% NYC hotspot auto-subdivides into 9 tight neighborhood row groups!</text>
  <text x="516" y="250" class="mono cg">• parquet_row_group_size_bytes = '32MB' caps wide-column writer RAM</text>
  <text x="516" y="268" class="mono cg">• skip_stats_columns = ['wide_payload'] keeps PG catalog compact</text>

  <!-- Bottom: Two-Phase Late Materialization -->
  <rect x="20" y="306" width="1000" height="114" class="card-late"/>
  <text x="38" y="330" class="h3 cb">Two-Phase Late Materialization for Billion-Row Wide Tables</text>

  <rect x="38" y="344" width="288" height="58" class="box"/>
  <text x="50" y="366" class="mono cb">Phase 1: Narrow Filter CTE</text>
  <text x="50" y="386" class="sub">Scans only (id, hilbert_id, lat, lon, ts)</text>

  <rect x="368" y="344" width="288" height="58" class="box"/>
  <text x="380" y="366" class="mono ca">Zone-Map + Merge Pruning</text>
  <text x="380" y="386" class="sub">Skips 95%+ of row groups &amp; wide chunks</text>

  <rect x="698" y="344" width="302" height="58" class="box-hit"/>
  <text x="710" y="366" class="mono cg">Phase 2: Fetch Wide Bytes for Top-K</text>
  <text x="710" y="386" class="sub">JOIN USING (id) reads only matched 8 KiB blocks</text>

  <path d="M 326 373 L 362 373" class="f-arr" marker-end="url(#f5-g)"/>
  <path d="M 656 373 L 692 373" class="f-arr" marker-end="url(#f5-g)"/>
</svg>
