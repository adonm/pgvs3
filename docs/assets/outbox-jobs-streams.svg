<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" role="img" aria-labelledby="fig6-title fig6-desc">
  <title id="fig6-title">FIG 06 — Transactional SQL Outbox, OJS Lazy Claims and 3-Segment TRUNCATE Streams</title>
  <desc id="fig6-desc">Two non-crossing horizontal pipelines: OJS job outbox, relay, SKIP LOCKED claim, receipt commit, and an explicit HTTP 200 ACK across four database commits; and PgQue-shaped three-segment TRUNCATE streams with a cyclic rotation from the truncate segment back to the active segment once every cursor passes sealed_xid.</desc>
  <defs>
    <marker id="f6-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--blue)"/>
    </marker>
    <marker id="f6-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--purple)"/>
    </marker>
    <marker id="f6-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--success)"/>
    </marker>
  </defs>
  <style>
    svg {
      color-scheme: light dark;
      --bg: light-dark(#ffffff, #09090b);
      --hdr: light-dark(#fafafa, #121215);
      --panel: light-dark(#fafafa, #141417);
      --card: light-dark(#ffffff, #18181b);
      --pill: light-dark(#f4f4f5, #27272a);
      --border: light-dark(#e4e4e7, #303036);
      --fg: light-dark(#262626, #e5e5e5);
      --muted: light-dark(#71717a, #a1a1aa);
      --blue: light-dark(#0369a1, #38bdf8);
      --success: light-dark(#008032, #6cc070);
      --warning: light-dark(#a65b00, #f0a030);
      --purple: light-dark(#6d28d9, #c084fc);
      --danger: light-dark(#d32f2f, #f4807b);
    }
    .bg { fill: var(--bg); }
    .hdr { fill: var(--hdr); }
    .panel { fill: var(--panel); stroke: var(--border); stroke-width: 1; }
    .card { fill: var(--card); stroke: var(--border); stroke-width: 1.2; }
    .chip { fill: var(--pill); stroke: var(--border); stroke-width: 1; }
    .fig { fill: var(--blue); font: 700 10.5px ui-monospace, Consolas, monospace; letter-spacing: 0.06em; }
    .title { fill: var(--fg); font: 600 14.5px system-ui, -apple-system, sans-serif; }
    .h3 { fill: var(--fg); font: 600 12.5px system-ui, -apple-system, sans-serif; }
    .h4 { fill: var(--fg); font: 600 11.5px system-ui, -apple-system, sans-serif; }
    .sub { fill: var(--muted); font: 400 9.8px system-ui, -apple-system, sans-serif; }
    .mono { fill: var(--fg); font: 600 9.8px ui-monospace, Consolas, monospace; }
    .mono-s { fill: var(--fg); font: 600 9.3px ui-monospace, Consolas, monospace; }
    .cb { fill: var(--blue); }
    .cg { fill: var(--success); }
    .ca { fill: var(--warning); }
    .cp { fill: var(--purple); }
    .cr { fill: var(--danger); }
    .dot-b { fill: var(--blue); }
    .dot-g { fill: var(--success); }
    .dot-a { fill: var(--warning); }
    .dot-p { fill: var(--purple); }
    .ln { stroke: var(--border); stroke-width: 1.2; fill: none; }
    .flow { stroke-width: 1.6; fill: none; stroke-dasharray: 5 7; stroke-linecap: round; animation: dash 1.8s linear infinite; }
    .flow-b { stroke: var(--blue); }
    .flow-g { stroke: var(--success); }
    .flow-p { stroke: var(--purple); }
    .s1 { animation-delay: 0s; }
    .s2 { animation-delay: 0.3s; }
    .s3 { animation-delay: 0.6s; }
    .s4 { animation-delay: 0.9s; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>

  <rect width="1040" height="480" class="bg" rx="8"/>
  <rect x="0" y="0" width="1040" height="44" class="hdr" rx="8"/>
  <line x1="0" y1="44" x2="1040" y2="44" class="ln"/>
  <text x="24" y="27" class="fig">FIG 06</text>
  <text x="80" y="27" class="title">Queue &amp; Stream Model (s3q_&lt;name&gt;): Outbox Boundaries &amp; 3-Segment TRUNCATE</text>

  <!-- Pipeline 1: OJS jobs, four commits and HTTP ACK -->
  <rect x="20" y="56" width="1000" height="168" class="panel" rx="8"/>
  <text x="36" y="78" class="h3 cb">1. OJS Competing Jobs — 4 DB Commits + HTTP 200 ACK</text>

  <rect x="36" y="92" width="216" height="114" class="card" rx="6"/>
  <rect x="36" y="98" width="4" height="102" rx="2" fill="var(--blue)"/>
  <text x="48" y="114" class="h4 cb">Tx 1: Producer SQL + Outbox</text>
  <text x="48" y="133" class="mono">UPDATE orders +</text>
  <text x="48" y="149" class="mono">INSERT INTO outbox</text>
  <text x="48" y="168" class="sub">Rollback leaves 0 jobs</text>
  <text x="48" y="186" class="mono ca">args: JSON array [...]</text>
  <circle cx="240" cy="104" r="3" class="dot-b pulse"/>

  <rect x="284" y="92" width="216" height="114" class="card" rx="6"/>
  <rect x="284" y="98" width="4" height="102" rx="2" fill="var(--purple)"/>
  <text x="296" y="114" class="h4 cp">Tx 2: Relay Enqueue</text>
  <text x="296" y="133" class="mono">POST /ojs/v1/jobs</text>
  <text x="296" y="151" class="sub">Lost reply? Retry POST:</text>
  <text x="296" y="167" class="sub">409 → GET &amp; verify body</text>
  <text x="296" y="186" class="mono cr">Mismatch halts &amp; alerts</text>
  <circle cx="488" cy="104" r="3" class="dot-p pulse"/>

  <rect x="532" y="92" width="216" height="114" class="card" rx="6"/>
  <rect x="532" y="98" width="4" height="102" rx="2" fill="var(--purple)"/>
  <text x="544" y="114" class="h4 cp">Tx 3: SKIP LOCKED Claim</text>
  <text x="544" y="133" class="mono">FOR UPDATE SKIP LOCKED</text>
  <text x="544" y="151" class="sub">1 index: (priority DESC,</text>
  <text x="544" y="167" class="sub">next_visible_at, seq)</text>
  <text x="544" y="186" class="mono cg">Issues UUIDv7 lease_token</text>
  <circle cx="736" cy="104" r="3" class="dot-p pulse"/>

  <rect x="780" y="92" width="224" height="114" class="card" rx="6"/>
  <rect x="780" y="98" width="4" height="102" rx="2" fill="var(--success)"/>
  <text x="792" y="114" class="h4 cg">Tx 4: Receipt Commit + HTTP ACK</text>
  <text x="792" y="133" class="mono">INSERT INTO receipts</text>
  <text x="792" y="150" class="sub">Commits with SQL effect</text>
  <text x="792" y="168" class="mono">POST /workers/ack</text>
  <rect x="792" y="176" width="116" height="20" class="chip" rx="4"/>
  <text x="802" y="190" class="mono-s cg">HTTP 200 ACK</text>
  <circle cx="992" cy="99" r="3" class="dot-g pulse"/>

  <path d="M 252 149 H 278" class="ln"/>
  <path d="M 252 149 H 278" class="flow flow-b s1" marker-end="url(#f6-b)"/>
  <path d="M 500 149 H 526" class="ln"/>
  <path d="M 500 149 H 526" class="flow flow-p s2" marker-end="url(#f6-p)"/>
  <path d="M 748 149 H 774" class="ln"/>
  <path d="M 748 149 H 774" class="flow flow-g s3" marker-end="url(#f6-g)"/>

  <!-- Pipeline 2: PgQue-shaped three-segment TRUNCATE streams -->
  <rect x="20" y="240" width="1000" height="210" class="panel" rx="8"/>
  <text x="36" y="262" class="h3 cg">2. PgQue-Shaped Fan-Out Streams — Snapshot Ticks &amp; Zero-Bloat 3-Segment TRUNCATE</text>

  <rect x="36" y="276" width="248" height="114" class="card" rx="6"/>
  <rect x="36" y="282" width="4" height="102" rx="2" fill="var(--blue)"/>
  <text x="48" y="298" class="h4 cb">Snapshot-Delimited Ticks</text>
  <text x="48" y="317" class="mono">pg_visible_in_snapshot()</text>
  <text x="48" y="335" class="sub">Prevents late-commit sequence</text>
  <text x="48" y="351" class="sub">gaps; `max` ceiling returns 413</text>
  <text x="48" y="370" class="mono ca">Repeat receive = same batch</text>
  <circle cx="268" cy="288" r="3" class="dot-b pulse"/>

  <rect x="316" y="276" width="208" height="114" class="card" rx="6"/>
  <rect x="316" y="282" width="4" height="102" rx="2" fill="var(--success)"/>
  <text x="328" y="298" class="h4 cb">Segment 0 (Active)</text>
  <text x="328" y="317" class="mono">stream_events_0</text>
  <text x="328" y="335" class="sub">Receives appends &amp; retries</text>
  <text x="328" y="351" class="sub">Rotates at retention / 2</text>
  <text x="328" y="370" class="mono">(default: 3.5 days)</text>
  <circle cx="508" cy="288" r="3" class="dot-g pulse"/>

  <rect x="556" y="276" width="208" height="114" class="card" rx="6"/>
  <rect x="556" y="282" width="4" height="102" rx="2" fill="var(--purple)"/>
  <text x="568" y="298" class="h4 cp">Segment 1 (Sealed)</text>
  <text x="568" y="317" class="mono">stream_events_1</text>
  <text x="568" y="335" class="sub">Records `sealed_xid`</text>
  <text x="568" y="351" class="sub">Consumers drain batches</text>
  <text x="568" y="370" class="mono ca">Slow cursor pins segment</text>
  <circle cx="748" cy="288" r="3" class="dot-p pulse"/>

  <rect x="796" y="276" width="208" height="114" class="card" rx="6"/>
  <rect x="796" y="282" width="4" height="102" rx="2" fill="var(--warning)"/>
  <text x="808" y="298" class="h4 cg">Segment 2 (Truncate)</text>
  <text x="808" y="317" class="mono">TRUNCATE TABLE</text>
  <text x="808" y="335" class="sub">When all cursors pass</text>
  <text x="808" y="351" class="sub">`sealed_xid` → instant</text>
  <text x="808" y="370" class="mono cg">OS reclaim · 0 dead tuples</text>
  <circle cx="988" cy="288" r="3" class="dot-a pulse"/>

  <path d="M 284 333 H 310" class="ln"/>
  <path d="M 284 333 H 310" class="flow flow-b s4" marker-end="url(#f6-b)"/>
  <path d="M 524 333 H 550" class="ln"/>
  <path d="M 524 333 H 550" class="flow flow-p s1" marker-end="url(#f6-p)"/>
  <path d="M 764 333 H 790" class="ln"/>
  <path d="M 764 333 H 790" class="flow flow-g s2" marker-end="url(#f6-g)"/>

  <!-- Cyclic rotation: truncate segment -> active segment once cursors pass sealed_xid -->
  <path d="M 900 390 L 900 424 Q 900 432 892 432 L 428 432 Q 420 432 420 424 L 420 390" class="ln"/>
  <path d="M 900 390 L 900 424 Q 900 432 892 432 L 428 432 Q 420 432 420 424 L 420 390" class="flow flow-p s3" marker-end="url(#f6-p)"/>
  <text x="480" y="421" class="mono-s cp">when all cursors pass sealed_xid &amp; no active batch</text>
</svg>
