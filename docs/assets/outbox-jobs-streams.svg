<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" role="img" aria-labelledby="q-title q-desc">
  <title id="q-title">Transactional SQL Outbox, OJS Lazy Claims and 3-Segment TRUNCATE Stream Rotation</title>
  <desc id="q-desc">Two non-crossing horizontal pipelines in Oat UI light/dark adaptive style showing OJS job outbox/claim/receipt boundaries and PgQue-shaped 3-segment TRUNCATE stream rotation.</desc>
  <defs>
    <marker id="qc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--blue)"/>
    </marker>
    <marker id="qp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--purple)"/>
    </marker>
    <marker id="qg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--success)"/>
    </marker>
  </defs>
  <style>
    svg {
      color-scheme: light dark;
      --bg: light-dark(#ffffff, #09090b);
      --lane: light-dark(#fafafa, #18181b);
      --box: light-dark(#ffffff, #1e1e21);
      --border: light-dark(#e4e4e7, #303036);
      --fg: light-dark(#262626, #e5e5e5);
      --muted: light-dark(#71717a, #a1a1aa);
      --blue: light-dark(#0284c7, #38bdf8);
      --success: light-dark(#008032, #6cc070);
      --warning: light-dark(#a65b00, #f0a030);
      --danger: light-dark(#d32f2f, #f4807b);
      --purple: light-dark(#7c3aed, #c084fc);
      --hit-bg: light-dark(#e6f4ea, #064e3b);
    }
    .bg { fill: var(--bg); }
    .lane { fill: var(--lane); stroke: var(--border); stroke-width: 1.5; rx: 8; }
    .b-sql { fill: var(--box); stroke: var(--blue); stroke-width: 1.6; rx: 6; }
    .b-ojs { fill: var(--box); stroke: var(--purple); stroke-width: 1.6; rx: 6; }
    .b-ack { fill: var(--hit-bg); stroke: var(--success); stroke-width: 1.6; rx: 6; }
    .title { fill: var(--fg); font: 600 16px system-ui, -apple-system, sans-serif; }
    .h3 { fill: var(--fg); font: 600 13px system-ui, -apple-system, sans-serif; }
    .h4 { fill: var(--fg); font: 600 12px system-ui, -apple-system, sans-serif; }
    .sub { fill: var(--muted); font: 400 10.8px system-ui, -apple-system, sans-serif; }
    .mono { fill: var(--fg); font: 600 10.5px ui-monospace, Consolas, monospace; }
    .c-blue { fill: var(--blue); }
    .c-green { fill: var(--success); }
    .c-amber { fill: var(--warning); }
    .c-red { fill: var(--danger); }
    .c-purple { fill: var(--purple); }
    .fc { stroke: var(--blue); stroke-width: 2.3; fill: none; stroke-dasharray: 8 6; animation: qf 1.3s linear infinite; }
    .fp { stroke: var(--purple); stroke-width: 2.3; fill: none; stroke-dasharray: 8 6; animation: qf 1.3s linear infinite; }
    .fg { stroke: var(--success); stroke-width: 2.3; fill: none; stroke-dasharray: 8 6; animation: qf 1.3s linear infinite; }
    @keyframes qf { to { stroke-dashoffset: -28; } }
    @media (prefers-reduced-motion: reduce) {
      .fc, .fp, .fg { animation: none; }
    }
  </style>

  <rect width="1040" height="430" class="bg" rx="8"/>
  <text x="28" y="34" class="title">Queue &amp; Stream Model (s3q_&lt;name&gt;): Outbox Transaction Boundaries &amp; 3-Segment TRUNCATE</text>

  <!-- Pipeline 1: OJS Jobs -->
  <rect x="28" y="54" width="984" height="168" class="lane"/>
  <text x="44" y="78" class="h3 c-blue">1. OJS Competing Jobs — 4 Separate Transaction Boundaries</text>

  <rect x="44" y="92" width="212" height="112" class="b-sql"/>
  <text x="56" y="114" class="h4 c-blue">Tx 1: Producer SQL</text>
  <text x="56" y="133" class="mono">UPDATE orders +</text>
  <text x="56" y="149" class="mono">INSERT INTO outbox</text>
  <text x="56" y="168" class="sub">Rollback leaves 0 jobs</text>
  <text x="56" y="185" class="mono c-amber">args: JSON array [...]</text>

  <rect x="288" y="92" width="212" height="112" class="b-ojs"/>
  <text x="300" y="114" class="h4 c-purple">Tx 2: Relay Enqueue</text>
  <text x="300" y="133" class="mono">POST /ojs/v1/jobs</text>
  <text x="300" y="151" class="sub">Lost reply? Retry POST:</text>
  <text x="300" y="167" class="sub">409 → GET &amp; verify body</text>
  <text x="300" y="185" class="mono c-red">Mismatch halts &amp; alerts</text>

  <rect x="532" y="92" width="212" height="112" class="b-ojs"/>
  <text x="544" y="114" class="h4 c-purple">Tx 3: Lazy Claim</text>
  <text x="544" y="133" class="mono">FOR UPDATE SKIP LOCKED</text>
  <text x="544" y="151" class="sub">1 index: (priority DESC,</text>
  <text x="544" y="167" class="sub">next_visible_at, seq)</text>
  <text x="544" y="185" class="mono c-green">Issues UUIDv7 lease_token</text>

  <rect x="776" y="92" width="220" height="112" class="b-ack"/>
  <text x="788" y="114" class="h4 c-green">Tx 4 → 5: Receipt &amp; ACK</text>
  <text x="788" y="133" class="mono">INSERT INTO receipts</text>
  <text x="788" y="151" class="sub">Commits with SQL effect</text>
  <text x="788" y="167" class="sub">before POST /workers/ack</text>
  <text x="788" y="185" class="mono c-amber">Stale token → 409 conflict</text>

  <path d="M 256 148 L 282 148" class="fc" marker-end="url(#qc)"/>
  <path d="M 500 148 L 526 148" class="fp" marker-end="url(#qp)"/>
  <path d="M 744 148 L 770 148" class="fg" marker-end="url(#qg)"/>

  <!-- Pipeline 2: PgQue-Shaped Streams -->
  <rect x="28" y="240" width="984" height="168" class="lane"/>
  <text x="44" y="264" class="h3 c-green">2. PgQue-Shaped Fan-Out Streams — Snapshot Ticks &amp; Zero-Bloat 3-Segment TRUNCATE</text>

  <rect x="44" y="278" width="246" height="112" class="b-sql"/>
  <text x="56" y="300" class="h4 c-blue">Snapshot-Delimited Ticks</text>
  <text x="56" y="319" class="mono">pg_visible_in_snapshot()</text>
  <text x="56" y="337" class="sub">Prevents late-commit sequence</text>
  <text x="56" y="353" class="sub">gaps; `max` ceiling returns 413</text>
  <text x="56" y="371" class="mono c-amber">Repeat receive = same batch</text>

  <rect x="322" y="278" width="204" height="112" class="b-sql"/>
  <text x="334" y="300" class="h4 c-blue">Segment 0 (Active)</text>
  <text x="334" y="319" class="mono">stream_events_0</text>
  <text x="334" y="337" class="sub">Receives appends &amp; retries</text>
  <text x="334" y="353" class="sub">Rotates at retention / 2</text>
  <text x="334" y="371" class="mono">(default: 3.5 days)</text>

  <rect x="558" y="278" width="204" height="112" class="b-ojs"/>
  <text x="570" y="300" class="h4 c-purple">Segment 1 (Sealed)</text>
  <text x="570" y="319" class="mono">stream_events_1</text>
  <text x="570" y="337" class="sub">Records `sealed_xid`</text>
  <text x="570" y="353" class="sub">Consumers drain batches</text>
  <text x="570" y="371" class="mono c-amber">Slow cursor pins segment</text>

  <rect x="794" y="278" width="202" height="112" class="b-ack"/>
  <text x="806" y="300" class="h4 c-green">Segment 2 (Truncate)</text>
  <text x="806" y="319" class="mono">TRUNCATE TABLE</text>
  <text x="806" y="337" class="sub">When all cursors pass</text>
  <text x="806" y="353" class="sub">`sealed_xid` → instant</text>
  <text x="806" y="371" class="mono c-green">OS reclaim · 0 dead tuples</text>

  <path d="M 290 334 L 316 334" class="fc" marker-end="url(#qc)"/>
  <path d="M 526 334 L 552 334" class="fp" marker-end="url(#qp)"/>
  <path d="M 762 334 L 788 334" class="fg" marker-end="url(#qg)"/>
</svg>
