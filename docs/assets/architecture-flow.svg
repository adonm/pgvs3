<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">pgvs3 System Architecture and Parallel Data Lanes</title>
  <desc id="arch-desc">Clean four-column, non-crossing architecture diagram showing Clients, Stateless Gateways, PostgreSQL 18 Primary, and Standby/Origin targets with animated packet flows.</desc>
  <defs>
    <linearGradient id="bg-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>
  <style>
    .bg { fill: url(#bg-a); }
    .col { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 12; }
    .node { fill: #0f172a; stroke: #475569; stroke-width: 1.5; rx: 8; }
    .node-c { fill: #0f172a; stroke: #38bdf8; stroke-width: 1.8; rx: 8; }
    .node-g { fill: #0f172a; stroke: #34d399; stroke-width: 1.8; rx: 8; }
    .node-p { fill: #0f172a; stroke: #c084fc; stroke-width: 1.8; rx: 8; }
    .node-a { fill: #0f172a; stroke: #fbbf24; stroke-width: 1.8; rx: 8; }
    .title { fill: #f8fafc; font: 700 16px 'Inter', system-ui, sans-serif; }
    .col-hdr { fill: #94a3b8; font: 700 11px 'Inter', system-ui, sans-serif; letter-spacing: 0.08em; }
    .h3 { fill: #f8fafc; font: 700 13px 'Inter', system-ui, sans-serif; }
    .sub { fill: #94a3b8; font: 500 11px 'Inter', system-ui, sans-serif; }
    .mono { fill: #7dd3fc; font: 600 10.5px 'JetBrains Mono', monospace; }
    .lane-c { stroke: #38bdf8; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; animation: flow 1.2s linear infinite; }
    .lane-g { stroke: #34d399; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; animation: flow 1.2s linear infinite; }
    .lane-p { stroke: #c084fc; stroke-width: 2.8; fill: none; stroke-dasharray: 8 6; animation: flow 1.0s linear infinite; }
    .lane-a { stroke: #fbbf24; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; animation: flow 1.5s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @media (prefers-reduced-motion: reduce) {
      .lane-c, .lane-g, .lane-p, .lane-a { animation: none; }
    }
  </style>

  <rect width="1040" height="480" class="bg" rx="14"/>
  <text x="28" y="34" class="title">pgvs3 — Parallel Data Lanes &amp; Authority Boundaries (Zero Crossings)</text>

  <!-- Column Headers -->
  <text x="40" y="64" class="col-hdr">1. CLIENTS</text>
  <text x="296" y="64" class="col-hdr">2. STATELESS GATEWAYS (:8014)</text>
  <text x="580" y="64" class="col-hdr">3. POSTGRESQL 18 PRIMARY</text>
  <text x="836" y="64" class="col-hdr">4. REPLICAS &amp; ORIGIN</text>

  <!-- LANE 1 (Top): Direct OLTP SQL & DuckLake Catalog -->
  <rect x="28" y="80" width="196" height="72" class="node"/>
  <text x="44" y="106" class="h3">OLTP &amp; DuckLake SQL</text>
  <text x="44" y="124" class="sub">App tables · Outbox · Catalog</text>
  <text x="44" y="141" class="mono">:5432 / PgBouncer :6432</text>

  <rect x="568" y="80" width="204" height="72" class="node-c"/>
  <text x="584" y="106" class="h3" fill="#38bdf8">App &amp; Catalog Schemas</text>
  <text x="584" y="124" class="sub">guide_app · ducklake_catalog</text>
  <text x="584" y="141" class="mono">Independent SQL Tx</text>

  <path d="M 224 116 L 562 116" class="lane-c" marker-end="url(#arr-c)"/>
  <text x="330" y="108" class="mono" fill="#38bdf8">Direct SQL (Bypasses Gateway)</text>

  <!-- LANE 2 (Upper-Mid): S3 / DuckDB / OJS Writes & Hot Reads -->
  <rect x="28" y="176" width="196" height="96" class="node"/>
  <text x="44" y="202" class="h3">DuckDB / S3 / OJS</text>
  <text x="44" y="220" class="sub">10 MiB–1 GiB Parquet</text>
  <text x="44" y="238" class="sub">OJS Jobs &amp; Streams</text>
  <text x="44" y="256" class="mono">RESP2 Pipelined Cache</text>

  <rect x="284" y="176" width="220" height="176" class="node-c"/>
  <text x="300" y="202" class="h3" fill="#38bdf8">Writable Fleet (pgvs3)</text>
  <text x="300" y="222" class="sub">• Admission: 32 active + 64 wait</text>
  <text x="300" y="240" class="sub">• Spool guard: 8 GiB fail-fast</text>
  <text x="300" y="258" class="sub">• mainPool (B-tree) + chunkPool</text>
  <text x="300" y="276" class="sub">• Advisory-locked reaper/leader</text>
  <rect x="300" y="292" width="188" height="44" rx="6" fill="#172554"/>
  <text x="310" y="311" class="mono" fill="#93c5fd">Session Advisory Locks:</text>
  <text x="310" y="326" class="mono" fill="#7dd3fc">Direct or Session Pool Only</text>

  <rect x="568" y="176" width="204" height="96" class="node-c"/>
  <text x="584" y="202" class="h3" fill="#38bdf8">Primary Data Schemas</text>
  <text x="584" y="220" class="mono">s3b_ (Native) · s3q_ (Queues)</text>
  <text x="584" y="238" class="mono">s3p  (Catalog &amp; Leases)</text>
  <text x="584" y="256" class="sub">8,120 B pages · MVCC publish</text>

  <path d="M 224 224 L 278 224" class="lane-c" marker-end="url(#arr-c)"/>
  <path d="M 504 224 L 562 224" class="lane-c" marker-end="url(#arr-c)"/>

  <!-- LANE 3 (Lower-Mid): Origin Cache (s3c_) & Durable Write-Back (s3w_) -->
  <rect x="568" y="292" width="204" height="84" class="node-a"/>
  <text x="584" y="318" class="h3" fill="#fbbf24">Cache &amp; Staging</text>
  <text x="584" y="336" class="mono" fill="#fde68a">s3c_ (Fills) · s3w_ (Pending)</text>
  <text x="584" y="354" class="sub">s3w_ never expires until drain</text>

  <rect x="824" y="292" width="188" height="84" class="node-a"/>
  <text x="840" y="318" class="h3" fill="#fbbf24">S3 / HTTP Origin</text>
  <text x="840" y="336" class="sub">Coalesced 1-GET cold fill</text>
  <text x="840" y="354" class="mono" fill="#fde68a">Leased outbox PUT drain</text>

  <path d="M 504 334 L 562 334" class="lane-a" marker-end="url(#arr-a)"/>
  <path d="M 772 334 L 818 334" class="lane-a" marker-end="url(#arr-a)"/>

  <!-- LANE 4 (Bottom): Read-Only Gateway Fleet & Physical Standbys -->
  <rect x="28" y="376" width="196" height="76" class="node"/>
  <text x="44" y="402" class="h3">Scale-Out Readers</text>
  <text x="44" y="420" class="sub">DuckDB · S3 GET / Range</text>
  <text x="44" y="438" class="mono">Read-only service endpoint</text>

  <rect x="284" y="376" width="220" height="76" class="node-g"/>
  <text x="300" y="402" class="h3" fill="#34d399">Read-Only Fleet (--read-only)</text>
  <text x="300" y="420" class="sub">Rejects mutations (403)</text>
  <text x="300" y="438" class="mono" fill="#6ee7b7">Serves s3b_, s3c_ &amp; s3w_ hits</text>

  <rect x="824" y="376" width="188" height="76" class="node-p"/>
  <text x="840" y="402" class="h3" fill="#c084fc">Physical Standbys</text>
  <text x="840" y="420" class="sub">Streaming WAL replay</text>
  <text x="840" y="438" class="mono" fill="#d8b4fe">replay_lsn &gt;= flush_lsn</text>

  <!-- Non-crossing bottom & vertical WAL paths -->
  <path d="M 224 414 L 278 414" class="lane-g" marker-end="url(#arr-g)"/>
  <path d="M 818 414 L 510 414" class="lane-g" marker-end="url(#arr-g)"/>
  <text x="615" y="434" class="mono" fill="#34d399">Replicated Page Hits (0 Origin GETs)</text>

  <!-- Vertical WAL stream from Primary to Standby (along right column, no crossing) -->
  <path d="M 772 224 L 918 224 L 918 282" class="lane-p" stroke-dasharray="none" opacity="0"/>
  <path d="M 670 376 L 670 392 L 818 392" class="lane-p" marker-end="url(#arr-p)"/>
  <text x="682" y="388" class="mono" fill="#c084fc">WAL Stream</text>
</svg>
