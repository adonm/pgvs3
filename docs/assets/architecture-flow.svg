<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" role="img" aria-labelledby="fig1-title fig1-desc">
  <title id="fig1-title">FIG 01 — System Topology and Parallel Authority Lanes</title>
  <desc id="fig1-desc">Four-column topology: a direct :5432 SQL bypass from OLTP and DuckLake into the app and catalog databases, stateless writable and read-only gateways with writer-gate and S3-FIFO block caching, a PostgreSQL 18 primary holding s3b_/s3q_/s3p/s3c_/s3w_ state, physical standbys, and a direct writable-fleet path to the S3/HTTP origin. pgvs3 lanes never cross each other; direct SQL never enters a gateway.</desc>
  <defs>
    <marker id="f1-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--blue)"/>
    </marker>
    <marker id="f1-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--success)"/>
    </marker>
    <marker id="f1-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--purple)"/>
    </marker>
    <marker id="f1-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--warning)"/>
    </marker>
  </defs>
  <style>
    svg {
      color-scheme: light dark;
      --bg: light-dark(#ffffff, #09090b);
      --hdr: light-dark(#fafafa, #121215);
      --panel: light-dark(#fafafa, #141417);
      --card: light-dark(#ffffff, #18181b);
      --pill: light-dark(#f4f4f5, #27272a);
      --border: light-dark(#e4e4e7, #303036);
      --fg: light-dark(#262626, #e5e5e5);
      --muted: light-dark(#71717a, #a1a1aa);
      --blue: light-dark(#0369a1, #38bdf8);
      --success: light-dark(#008032, #6cc070);
      --warning: light-dark(#a65b00, #f0a030);
      --purple: light-dark(#6d28d9, #c084fc);
      --danger: light-dark(#d32f2f, #f4807b);
    }
    .bg { fill: var(--bg); }
    .hdr { fill: var(--hdr); }
    .panel { fill: var(--panel); stroke: var(--border); stroke-width: 1; }
    .card { fill: var(--card); stroke: var(--border); stroke-width: 1.2; }
    .chip { fill: var(--pill); stroke: var(--border); stroke-width: 1; }
    .fig { fill: var(--blue); font: 700 10.5px ui-monospace, Consolas, monospace; letter-spacing: 0.06em; }
    .title { fill: var(--fg); font: 600 14.5px system-ui, -apple-system, sans-serif; }
    .col-t { fill: var(--muted); font: 700 10.5px system-ui, -apple-system, sans-serif; letter-spacing: 0.08em; }
    .h4 { fill: var(--fg); font: 600 12px system-ui, -apple-system, sans-serif; }
    .sub { fill: var(--muted); font: 400 10px system-ui, -apple-system, sans-serif; }
    .mono { fill: var(--fg); font: 600 10px ui-monospace, Consolas, monospace; }
    .mono-s { fill: var(--fg); font: 500 9.5px ui-monospace, Consolas, monospace; }
    .cb { fill: var(--blue); }
    .cg { fill: var(--success); }
    .ca { fill: var(--warning); }
    .cp { fill: var(--purple); }
    .cr { fill: var(--danger); }
    .dot-b { fill: var(--blue); }
    .dot-g { fill: var(--success); }
    .dot-a { fill: var(--warning); }
    .dot-p { fill: var(--purple); }
    .ln { stroke: var(--border); stroke-width: 1.2; fill: none; }
    .flow { stroke-width: 1.6; fill: none; stroke-dasharray: 5 7; stroke-linecap: round; animation: dash 1.8s linear infinite; }
    .flow-b { stroke: var(--blue); }
    .flow-g { stroke: var(--success); }
    .flow-a { stroke: var(--warning); }
    .flow-p { stroke: var(--purple); }
    .s1 { animation-delay: 0s; }
    .s2 { animation-delay: 0.35s; }
    .s3 { animation-delay: 0.7s; }
    .s4 { animation-delay: 1.05s; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>

  <rect width="1040" height="520" class="bg" rx="8"/>
  <rect x="0" y="0" width="1040" height="44" class="hdr" rx="8"/>
  <line x1="0" y1="44" x2="1040" y2="44" class="ln"/>
  <text x="24" y="27" class="fig">FIG 01</text>
  <text x="80" y="27" class="title">System Topology &amp; Parallel Authority Lanes</text>

  <circle cx="640" cy="22" r="3.5" class="dot-b"/>
  <text x="650" y="26" class="sub">SQL / S3 Write</text>
  <circle cx="744" cy="22" r="3.5" class="dot-g"/>
  <text x="754" y="26" class="sub">Warm Read Hit</text>
  <circle cx="846" cy="22" r="3.5" class="dot-p"/>
  <text x="856" y="26" class="sub">WAL Stream</text>
  <circle cx="946" cy="22" r="3.5" class="dot-a"/>
  <text x="956" y="26" class="sub">Origin I/O</text>

  <rect x="20" y="58" width="196" height="398" class="panel" rx="8"/>
  <text x="34" y="78" class="col-t">1. CLIENTS</text>

  <rect x="244" y="58" width="248" height="398" class="panel" rx="8"/>
  <text x="258" y="78" class="col-t">2. STATELESS GATEWAYS (:8014)</text>

  <rect x="520" y="58" width="252" height="398" class="panel" rx="8"/>
  <text x="534" y="78" class="col-t">3. POSTGRESQL 18 PRIMARY</text>

  <rect x="800" y="58" width="220" height="398" class="panel" rx="8"/>
  <text x="814" y="78" class="col-t">4. REPLICAS &amp; ORIGIN</text>

  <!-- LANE 1: direct SQL bypass, outside pgvs3 -->
  <rect x="32" y="92" width="172" height="70" class="card" rx="6"/>
  <rect x="32" y="98" width="4" height="58" rx="2" fill="var(--blue)"/>
  <text x="44" y="116" class="h4">OLTP &amp; DuckLake</text>
  <text x="44" y="134" class="mono cb">:5432 · :6432 pooler</text>
  <text x="44" y="151" class="sub">direct SQL · never proxied</text>
  <circle cx="194" cy="104" r="3" class="dot-b pulse"/>

  <rect x="532" y="92" width="228" height="70" class="card" rx="6"/>
  <rect x="532" y="98" width="4" height="58" rx="2" fill="var(--blue)"/>
  <text x="544" y="116" class="h4">App &amp; Catalog DBs</text>
  <text x="544" y="136" class="mono">guide_app · ducklake</text>
  <text x="544" y="153" class="sub">clients connect directly</text>
  <circle cx="748" cy="104" r="3" class="dot-b pulse"/>

  <!-- LANE 2: writable gateways and primary schemas -->
  <rect x="32" y="174" width="172" height="84" class="card" rx="6"/>
  <text x="44" y="198" class="h4">DuckDB / S3 / OJS</text>
  <text x="44" y="216" class="sub">10 MiB–1 GiB Parquet</text>
  <text x="44" y="234" class="mono">PUT · GET · Jobs · RESP2</text>
  <circle cx="194" cy="186" r="3" class="dot-b pulse"/>

  <rect x="256" y="174" width="224" height="210" class="card" rx="6"/>
  <rect x="256" y="180" width="4" height="198" rx="2" fill="var(--blue)"/>
  <text x="268" y="196" class="h4 cb">Writable Fleet (serve)</text>
  <circle cx="468" cy="186" r="3" class="dot-g pulse"/>

  <rect x="268" y="204" width="200" height="30" class="chip" rx="4"/>
  <text x="278" y="219" class="mono">Writer Gate · MaxConns/2</text>
  <text x="278" y="230" class="mono-s">max(MaxConns/2, 1) in flight</text>

  <rect x="268" y="240" width="200" height="30" class="chip" rx="4"/>
  <text x="278" y="255" class="mono">Block Cache · S3-FIFO</text>
  <text x="278" y="266" class="mono-s">32-row · 253.75 KiB per shard</text>

  <rect x="268" y="276" width="96" height="32" class="chip" rx="4"/>
  <text x="278" y="292" class="mono">S3 Guard</text>
  <text x="278" y="303" class="mono-s">32 + 64 wait</text>

  <rect x="372" y="276" width="96" height="32" class="chip" rx="4"/>
  <text x="382" y="292" class="mono">Spool Cap</text>
  <text x="382" y="303" class="mono-s">8 GiB disk</text>

  <rect x="268" y="314" width="96" height="32" class="chip" rx="4"/>
  <text x="278" y="330" class="mono cb">mainPool</text>
  <text x="278" y="341" class="mono-s">B-tree PK</text>

  <rect x="372" y="314" width="96" height="32" class="chip" rx="4"/>
  <text x="382" y="330" class="mono cg">chunkPool</text>
  <text x="382" y="341" class="mono-s">Bitmap AIO</text>

  <text x="268" y="362" class="mono">Session Advisory Locks</text>
  <text x="268" y="376" class="mono-s">Direct / Session Pool Only</text>

  <rect x="532" y="174" width="228" height="84" class="card" rx="6"/>
  <rect x="532" y="180" width="4" height="72" rx="2" fill="var(--blue)"/>
  <text x="544" y="198" class="h4 cb">Primary Schemas (v25)</text>
  <text x="544" y="218" class="mono">s3b_ Bytes · s3q_ OJS</text>
  <text x="544" y="236" class="sub">s3p catalog · 8,120 B pages</text>
  <circle cx="748" cy="186" r="3" class="dot-b pulse"/>

  <rect x="532" y="276" width="228" height="100" class="card" rx="6"/>
  <rect x="532" y="282" width="4" height="88" rx="2" fill="var(--warning)"/>
  <text x="544" y="298" class="h4 ca">s3c_ Cache &amp; s3w_ Stage</text>
  <text x="544" y="318" class="mono">--cache-max-bytes capacity</text>
  <text x="544" y="334" class="sub">evicts s3c_ + committed s3w_</text>
  <text x="544" y="352" class="mono">pending_uploads never evicted</text>
  <text x="544" y="368" class="sub">s3w_ non-expiring outbox</text>
  <circle cx="748" cy="288" r="3" class="dot-a pulse"/>

  <rect x="812" y="276" width="196" height="64" class="card" rx="6"/>
  <rect x="812" y="282" width="4" height="52" rx="2" fill="var(--warning)"/>
  <text x="824" y="300" class="h4 ca">S3 / HTTP Origin</text>
  <text x="824" y="320" class="mono">coalesced fill · direct PUT</text>
  <text x="824" y="336" class="sub">batch delete · range GET</text>
  <circle cx="996" cy="288" r="3" class="dot-a pulse"/>

  <!-- LANE 3: read-only fleet and physical standbys -->
  <rect x="32" y="392" width="172" height="64" class="card" rx="6"/>
  <text x="44" y="416" class="h4">Scale-Out Readers</text>
  <text x="44" y="436" class="mono cg">GET · Range · OJS Info</text>
  <circle cx="194" cy="404" r="3" class="dot-g pulse"/>

  <rect x="256" y="392" width="224" height="64" class="card" rx="6"/>
  <rect x="256" y="398" width="4" height="52" rx="2" fill="var(--success)"/>
  <text x="268" y="416" class="h4 cg">Read-Only (--read-only)</text>
  <text x="268" y="436" class="mono">Mutations → 403 Forbidden</text>
  <circle cx="468" cy="404" r="3" class="dot-g pulse"/>

  <rect x="812" y="392" width="196" height="64" class="card" rx="6"/>
  <rect x="812" y="398" width="4" height="52" rx="2" fill="var(--purple)"/>
  <text x="824" y="416" class="h4 cp">Physical Standbys</text>
  <text x="824" y="434" class="mono">Hot Standby Replay</text>
  <text x="824" y="449" class="sub">Pin/Snapshot Reads</text>
  <circle cx="996" cy="404" r="3" class="dot-p pulse"/>

  <!-- Direct SQL bypass: OLTP & DuckLake -> App & Catalog DBs on :5432 -->
  <rect x="216" y="108" width="300" height="18" class="chip" rx="4"/>
  <text x="224" y="121" class="mono-s cb">direct SQL bypass · :5432 · never proxied</text>
  <path id="p1-direct" d="M 204 127 H 526" class="ln"/>
  <path d="M 204 127 H 526" class="flow flow-b s1" marker-end="url(#f1-b)"/>

  <!-- Writable fleet -> primary schemas -->
  <path d="M 480 208 H 526" class="ln"/>
  <path d="M 480 208 H 526" class="flow flow-b s2" marker-end="url(#f1-b)"/>
  <text x="488" y="201" class="mono-s cb">SQL</text>

  <!-- Writable fleet -> S3/HTTP origin: coalesced fill, direct outbox PUT, batch delete -->
  <path d="M 480 344 H 500 V 482 H 1018 V 308 H 1008" class="ln"/>
  <path d="M 480 344 H 500 V 482 H 1018 V 308 H 1008" class="flow flow-a s3" marker-end="url(#f1-a)"/>
  <text x="520" y="474" class="mono-s ca">Coalesced Fill · Direct Outbox PUT · Batch Delete</text>

  <!-- WAL replication: primary -> physical standbys -->
  <path d="M 760 424 H 806" class="ln"/>
  <path d="M 760 424 H 806" class="flow flow-p s4" marker-end="url(#f1-p)"/>
  <text x="768" y="416" class="mono-s cp">WAL</text>

  <!-- Replayed page hits: standbys -> read-only fleet -->
  <path d="M 812 440 H 486" class="ln"/>
  <path d="M 812 440 H 486" class="flow flow-g s2" marker-end="url(#f1-g)"/>
  <text x="520" y="432" class="mono-s cg">Replicated Page Hits · pin/snapshot reads</text>
</svg>
