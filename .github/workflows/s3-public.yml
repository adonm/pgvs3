name: s3-public
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s3-public:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgvs3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGVS3_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/pgvs3_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise install
      - run: mise exec -- just s3-public
