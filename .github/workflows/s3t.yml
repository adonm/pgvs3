name: s3t

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s3t
  cancel-in-progress: false

jobs:
  s3t:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise install
      - name: Run s3t allow-list
        run: mise exec -- bash deploy/bench/stack.sh s3t
      - name: Upload gateway log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pgvs3-s3t-log
          path: .tmp/verify/**/*.log
          include-hidden-files: true
