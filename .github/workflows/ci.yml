name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgvs3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGVS3_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/pgvs3_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise install
      - run: mise exec -- just ci

  publish:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push'
    permissions:
      contents: write
      packages: write
    env:
      KO_DOCKER_REPO: ghcr.io/${{ github.repository }}
      CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise install
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish container image (amd64 + arm64); tag builds also publish Helm chart
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            export CHART_VERSION="${GITHUB_REF_NAME}"
            just chart push=true
            just image push=true
            ver="${GITHUB_REF_NAME}"
            semver="${ver#v}"
            if gh release view "${ver}" >/dev/null 2>&1; then
              gh release upload "${ver}" ".tmp/pgvs3/pgvs3-${semver}.tgz" --clobber
            else
              gh release create "${ver}" ".tmp/pgvs3/pgvs3-${semver}.tgz" \
                --title "${ver}" --generate-notes --verify-tag
            fi
          else
            just chart push=false
            just image push=true
          fi
