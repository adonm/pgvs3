name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise install
      - run: mise exec -- just docs
      - run: mise exec -- just ci
      - name: Upload verification logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verification-logs
          path: |
            .tmp/verify/**/*.log
            .tmp/verify/**/analytics.json
            .tmp/verify/**/replication.json
            .tmp/verify/**/guides.json
            .tmp/verify/**/canary/**
          include-hidden-files: true

  publish:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push'
    permissions:
      contents: write
      packages: write
    env:
      KO_DOCKER_REPO: ghcr.io/${{ github.repository }}
      CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise install
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish container image (amd64 + arm64) and Helm chart to GHCR
        run: |
          set -euo pipefail
          mkdir -p .tmp/pgvs3
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME}"
            semver="${ver#v}"
            tags="${ver},${semver},latest"
          else
            ver="${GITHUB_SHA::7}"
            semver="0.3.0"
            tags="latest,${ver}"
          fi
          mise exec go ko -- ko build --bare \
            --platform=linux/amd64,linux/arm64 \
            --tags "${tags}" \
            --ldflags "-s -w -X main.version=${ver}" \
            ./cmd/pgvs3
          mise exec helm -- helm lint deploy/charts/pgvs3
          mise exec helm -- helm package deploy/charts/pgvs3 \
            -d .tmp/pgvs3 --version "${semver}" --app-version "${ver}"
          mise exec helm -- helm push ".tmp/pgvs3/pgvs3-${semver}.tgz" "${CHART_REPO}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            if gh release view "${ver}" >/dev/null 2>&1; then
              gh release upload "${ver}" ".tmp/pgvs3/pgvs3-${semver}.tgz" --clobber
            else
              gh release create "${ver}" ".tmp/pgvs3/pgvs3-${semver}.tgz" \
                --title "${ver}" --generate-notes --verify-tag
            fi
          fi

  pages:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise install
      - run: mise exec -- just docs
      - name: Publish Quarto site to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          touch docs/_site/.nojekyll
          git -C docs/_site init -b gh-pages
          git -C docs/_site config user.name "github-actions[bot]"
          git -C docs/_site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C docs/_site add -A
          git -C docs/_site commit -m "docs: publish Quarto site (${GITHUB_SHA::7})"
          git -C docs/_site push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
