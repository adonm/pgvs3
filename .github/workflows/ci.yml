name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise install
      - run: mise exec -- just ci
      - run: mise exec -- just fault

  image:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    env:
      KO_DOCKER_REPO: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise install
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: ko build (amd64 + arm64)
        run: |
          mise exec go ko -- ko build --bare \
            --platform=linux/amd64,linux/arm64 \
            --tags latest \
            --ldflags "-s -w -X main.version=${GITHUB_SHA}" \
            ./cmd/pgvs3
