apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickwit
spec:
  replicas: 1
  # One indexer/control-plane writer; do not surge a replacement alongside
  # the old writer during a rollout.
  strategy: { type: Recreate, rollingUpdate: null }
  selector:
    matchLabels: { app: quickwit }
  template:
    metadata:
      labels: { app: quickwit, quickwit-peer: "true" }
    spec:
      containers:
        - name: quickwit
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          args: [run, --config, /etc/quickwit/quickwit.yaml]
          env:
            - name: QW_ENABLED_SERVICES
              {{- if gt (int .Values.searcher.replicas) 0 }}
              value: control_plane,metastore,indexer,janitor
              {{- else }}
              value: control_plane,metastore,indexer,janitor,searcher
              {{- end }}
            - name: QW_LISTEN_ADDRESS
              value: 0.0.0.0
            - name: QW_PEER_SEEDS
              value: quickwit-peers:7280
            - name: QW_METASTORE_URI
              valueFrom:
                secretKeyRef: { name: {{ .Values.metastoreSecretName | quote }}, key: metastoreUrl }
            - name: PGVS3_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.s3SecretName | quote }}, key: accessKey }
            - name: PGVS3_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.s3SecretName | quote }}, key: secretKey }
          ports:
            - { containerPort: 7280, name: rest }
            - { containerPort: 7281, name: grpc }
          readinessProbe:
            httpGet: { path: /api/v1/cluster, port: rest }
            periodSeconds: 5
            failureThreshold: 24
          volumeMounts:
            - { name: config, mountPath: /etc/quickwit }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: quickwit-config }
