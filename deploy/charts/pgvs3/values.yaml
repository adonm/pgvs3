replicas: 3
image: ghcr.io/adonm/pgvs3:latest
# Secret with `url` (and `caCert`, possibly empty, for a private database CA).
# The URL never enters Helm values or release history.
urlSecretName: pgvs3-db
s3SecretName: pgvs3-s3
region: us-east-1
# Idempotently created at startup; avoids a manual bucket bootstrap.
buckets: "lake"
# Keep below the container memory limit; Go uses it as a soft heap ceiling.
gomemlimit: "3Gi"
vhostDomain: ""
# Configure a TLS Secret for non-loopback deployments. Plaintext is an explicit
# opt-in for isolated test clusters only.
tlsSecretName: ""
allowHttp: false
allowPlaintextDb: false
# A per-replica ceiling. Size PostgreSQL max_connections for the whole fleet,
# including rollout headroom and other clients.
poolMax: 64
poolMin: 64
# Cross-AZ metadata cache. Static membership: the peer list is generated from
# `replicas` and the StatefulSet's ordinal DNS names. Do not combine with an
# HPA that changes the replica count without updating the peer list.
peerCache:
  enabled: true
  port: 8015
  mainBytes: 67108864
  hotBytes: 67108864
  # Optional Secret with a `token` key, sent on peer HTTP requests.
  secretName: ""
# One gateway per zone. Increase replicas in multiples of the number of zones
# if you need more.
topologySpread:
  enabled: true
  maxSkew: 1
  whenUnsatisfiable: DoNotSchedule
resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { memory: 4Gi }
# HPA is off by default because the peer list is static. Enable only with
# peerCache disabled or an external peer discovery controller.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 9
  targetCPUUtilizationPercentage: 70
