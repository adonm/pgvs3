replicas: 3
# Full image reference override. Empty means ghcr.io/adonm/pgvs3 at the chart
# appVersion, so a chart release pins the matching container image.
image: ""
imagePullPolicy: IfNotPresent
# Secret with a `url` key (standard libpq/pgx URL; sslmode controls DB TLS).
urlSecretName: pgvs3-db
# Keep below the container memory limit; Go uses it as a soft heap ceiling.
gomemlimit: "3GiB"
# A per-replica ceiling. Size PostgreSQL max_connections for the whole fleet,
# including rollout headroom and other clients.
poolMax: 64
# Leave 2 GiB between the spool payload budget and the emptyDir limit.
spoolMaxBytes: 8589934592
# Active S3 requests; excess waits in a queue of twice this, then gets 503 SlowDown.
s3Concurrency: 32
# Process-wide concurrent origin fills.
fillConcurrency: 8
# Aligned chunk size in bytes (0 uses 1 MiB default).
rangeCacheChunk: 1048576
# Origin S3 settings (empty endpoint uses AWS S3 for originRegion).
originEndpoint: ""
originRegion: "us-east-1"
originPathStyle: false
originInsecure: false
# Optional comma-separated bucket allowlist (empty allows any valid bucket).
buckets: ""
# Freshness: 0 = immutable (zero origin calls on cache hit); e.g. "5m" for conditional HEAD revalidation.
revalidateAfter: "0"
# Evict cached objects after this idle period.
cacheRetention: "24h"
# Evict oldest cached objects when cache exceeds this byte budget (0 disables).
cacheMaxBytes: 0
# Spread stateless gateway replicas across zones.
topologySpread:
  enabled: true
  maxSkew: 1
  whenUnsatisfiable: DoNotSchedule
resources:
  requests: { cpu: 250m, memory: 256Mi, ephemeral-storage: 10Gi }
  limits: { memory: 4Gi, ephemeral-storage: 12Gi }
# Let in-flight transfers finish after the 5s drain window.
terminationGracePeriodSeconds: 60
automountServiceAccountToken: false
podAnnotations: {}
podLabels: {}
# Extra environment variables and envFrom sources for the gateway container.
extraEnv: []
extraEnvFrom: []
podSecurityContext:
  runAsNonRoot: true
  # distroless/static:nonroot runs as 65532; fsGroup makes the /tmp emptyDir
  # writable for cache spooling under a read-only root filesystem.
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
# Unknown-length proxied uploads > 8 MiB spool to /tmp; it must be writable
# even with a read-only root filesystem. Raise sizeLimit if uploads exceed it.
tmpDir:
  sizeLimit: 10Gi
# Ingress is default-deny. The default allows clients in the release namespace;
# add namespaceSelector/podSelector entries for other namespaces. Some CNIs
# evaluate kubelet HTTP probes against this policy; add the node CIDR to
# ingress.from if readiness/liveness probes fail.
networkPolicy:
  enabled: true
  ingress:
    from:
      - podSelector: {}
  egress:
    # Keep true unless PostgreSQL and DNS are covered by explicit rules below.
    allowAll: true
    rules: []
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  relabelings: []
  metricRelabelings: []
podDisruptionBudget:
  enabled: true
  minAvailable: 1
autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 9
  targetCPUUtilizationPercentage: 70
