apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgvs3
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: { app: pgvs3 }
  template:
    metadata:
      labels:
        app: pgvs3
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            {{- toYaml .Values.tmpDir | nindent 12 }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels: { app: pgvs3 }
      {{- end }}
      containers:
        - name: pgvs3
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: PGVS3_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.urlSecretName | quote }}, key: url }
            - { name: PGVS3_POOL_MAX, value: {{ .Values.poolMax | quote }} }
            - { name: GOMEMLIMIT, value: {{ .Values.gomemlimit | quote }} }
          ports:
            - { containerPort: 8014, name: s3 }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          startupProbe:
            httpGet: { path: /healthz, port: 8014 }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /readyz, port: 8014 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8014 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
