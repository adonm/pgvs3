image: pgvs3-postgres:18-cron
storage: 20Gi
# Requests are small so the stack schedules on a 16 GiB CI runner; the limits
# are the headroom a real run uses.
resources:
  requests: { cpu: 250m, memory: 1Gi }
  limits: { memory: 8Gi }
# kind-up creates pgvs3 and ducklake_catalog with one idempotent Job. Two
# gateway pools (2 x 64) can briefly become four during a rolling update
# (64 x 4 = 256), while DuckLake and benchmark Jobs still need connections.
maxConnections: 384
sharedBuffers: 1GB
