{{- if .Values.suite }}
{{- $needsDb := has .Values.suite (list "validate" "click" "spatial") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "bench-{{ .Values.suite }}"
  labels: { app: kind-bench, suite: {{ .Values.suite | quote }} }
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: { app: kind-bench, suite: {{ .Values.suite | quote }} }
    spec:
      restartPolicy: Never
      containers:
        - name: bench
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          command: [bash, /bench/suites/run.sh, {{ .Values.suite | quote }}]
          env:
            {{- if $needsDb }}
            - name: PG_HOST
              valueFrom: { secretKeyRef: { name: {{ .Values.pgSecretName | quote }}, key: host } }
            - name: PG_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.pgSecretName | quote }}, key: user } }
            - name: PG_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.pgSecretName | quote }}, key: password } }
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: {{ .Values.s3SecretName | quote }}, key: accessKey } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.s3SecretName | quote }}, key: secretKey } }
            {{- end }}
            {{- if $needsDb }}
            - { name: PGVS3_URL, value: {{ .Values.pgvs3Url | quote }} }
            {{- end }}
            {{- range $k, $v := .Values.suiteEnv }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
