# Caching is intentionally ON everywhere: this is "real world" performance
# (DuckDB's external file cache, PostgreSQL's buffer cache). Warm passes are
# the point.
image: kind-bench:latest
pgSecretName: postgres
s3SecretName: pgvs3-s3
pgvs3Url: http://pgvs3:8014
# Only one Job is rendered at a time. `just kind-bench` sets this to each
# requested suite in turn and collects the results.
suite: ""
# QUICK=1 is smoke-scale QA. PARTS, PASSES, SPATIAL_SF and SPATIAL_QUERIES
# reach run.sh from the just recipe; candidate timings are not comparisons.
suiteEnv: {}
resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits: { memory: 8Gi }
