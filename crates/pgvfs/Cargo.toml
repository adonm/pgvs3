[package]
name = "pgvfs"
version = "0.1.0"
edition = "2021"
description = "DuckDB pgvfs:// filesystem storage: files as PostgreSQL byte rows"
license = "Apache-2.0"
repository = "https://github.com/adonm/pgvs3"

[lib]
# rlib for the contract tests; staticlib for the DuckDB extension (extension/).
crate-type = ["rlib", "staticlib"]

[dependencies]
anyhow = "1"
bytes = "1"
futures = "0.3"
# The PostgreSQL pool (pg.rs): MRU reuse, rustls, session setup.
pgvs3 = { path = "../pgvs3" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tokio-postgres = "0.7.18"
